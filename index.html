<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>임씨의 하루 — 주택가</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">IMC'S DAY · CHAPTER 1</p>
          <h1>임씨의 하루</h1>
        </div>
        <div class="mission" aria-live="polite">
          <span>오늘의 목표</span>
          <strong id="missionText">동네 사람들과 인사를 나누며 주택가를 둘러보자.</strong>
        </div>
      </header>

      <section class="game-stage" aria-label="주택가 탐험 게임">
        <canvas id="gameCanvas" width="960" height="576"></canvas>

        <div id="startScreen" class="game-overlay">
          <div class="overlay-card">
            <p class="eyebrow">AM 07:30 · 출근까지 1시간 30분</p>
            <h2>임씨의 하루</h2>
            <p>기숙사에서 출발해 방해꾼과 사건을 피해 오전 9시까지 회사에 도착하세요.</p>
            <label for="playerName">플레이어 이름</label>
            <input id="playerName" maxlength="12" placeholder="이름을 입력하세요" />
            <button id="startGameButton" type="button">출근 시작</button>
          </div>
        </div>

        <div id="endingScreen" class="game-overlay hidden">
          <div class="overlay-card">
            <p class="eyebrow" id="endingLabel">ENDING</p>
            <h2 id="endingTitle"></h2>
            <p id="endingText"></p>
            <div id="endingChoices" class="ending-choices"></div>
            <button id="restartGameButton" type="button">다시 출근하기</button>
          </div>
        </div>

        <div class="hud hud-left">
          <div class="hud-label">만난 이웃</div>
          <div><strong id="metCount">0</strong> / <span id="npcCount">0</span></div>
          <div class="event-progress">해결한 사건 <strong id="eventCount">0</strong> / <span id="eventTotal">3</span></div>
        </div>

        <aside class="quest-panel" aria-live="polite">
          <div class="hud-label">수주한 미션</div>
          <ul id="questList"><li class="quest-empty">아직 받은 미션이 없습니다.</li></ul>
        </aside>

        <div class="hud hud-right">
          <div class="hud-label">조작</div>
          <div>이동 WASD / 방향키</div>
          <div>대화 E / Space</div>
          <div class="clock" id="gameClock">08:00</div>
          <div id="conditionText">정상</div>
        </div>

        <div id="toast" class="toast" aria-live="polite"></div>

        <div id="challenge" class="challenge hidden" aria-live="polite">
          <strong id="challengeTitle">사건 진행 중</strong>
          <p id="challengeText"></p>
          <div class="challenge-track"><span id="challengeBar"></span></div>
        </div>

        <div id="mentalWords" class="mental-words" aria-hidden="true"></div>

        <div id="dialogue" class="dialogue hidden" role="dialog" aria-modal="false">
          <div class="portrait" id="portrait">?</div>
          <div class="dialogue-body">
            <div class="speaker" id="speaker">동네 주민</div>
            <p id="dialogueText"></p>
            <button id="nextButton" type="button">다음 <span>Space</span></button>
          </div>
        </div>
      </section>

    </main>
    <script src="script.js"></script>
  </body>
</html>
